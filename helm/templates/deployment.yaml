apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jiro.fullname" . }}
  labels:
    app.kubernetes.io/name: jiro-search
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jiro-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jiro-search
    spec:
      containers:
        - name: jiro
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- range $key, $value := .Values.config.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.config.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.config.envFromSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/jiro
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "jiro.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
